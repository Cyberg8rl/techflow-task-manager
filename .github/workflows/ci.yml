name: Python CI Pipeline

# Define quando o pipeline será executado
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório para a máquina virtual
    - name: Checkout do Código
      uses: actions/checkout@v3

    # 2. Configura a versão do Python
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Instala as dependências listadas no requirements.txt
    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa os testes automatizados usando pytest
    - name: Executar Testes Automatizados
      run: |
        pytest